<form th:fragment="content-list" th:action="@{/products/save}" method="POST" enctype="multipart/form-data" class="container mt-4">
    <div class="form-group">
        <label for="name">Product Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter product name" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter product description" required></textarea>
    </div>

    <div class="form-group">
        <label for="cost">Cost</label>
        <input type="number" class="form-control" id="cost" name="price" placeholder="Enter product cost" required>
    </div>

    <div class="form-group">
        <label for="code">Product Code</label>
        <input type="text" class="form-control" id="code" name="code" placeholder="Enter product code" required>
    </div>

    <div class="form-group">
        <label for="country">Country of Origin</label>
        <input type="text" class="form-control" id="country" name="country" placeholder="Enter country of origin" required>
    </div>

    <div class="form-group">
        <label for="image">Product Image</label>
        <input type="file" accept="image/*" class="form-control-file" id="image" name="image" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
