<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

</head>

<body>
    <table>
        <thead>
            <th>Id</th>
            <th>Name</th>
        </thead>
        <tbody>
            <tr th:each=" product : ${products}">
                <td th:text="${product.getId()}" ></td>
                <td th:text="${product.getCourse()}"></td>
            </tr>
        </tbody>
    </table>
    <form th:action="@{/products/saveProduct}" th:object="${newProduct}" method="post">
        <div class="mb-3">
            <label for="exampleInputEmail1" name="" class="form-label">Email address</label>
            <input type="text" class="form-control"  th:field="*{name}" id="exampleInputEmail1" placeholder="Product name"
                aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" th:field="*{country}" placeholder="Link" id="exampleInputPassword1">
        </div>
        <div class="mb-3 form-check">
            <input type="text" class="form-control" name="description" th:field="*{description}" placeholder="Description" id=""/>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
